[project]
name = "graph_rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "langgraph==1.2.9",
  "litellm==1.93.0",
  "mcp==1.28.1",
  "neo4j==6.2.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "uvicorn[standard]==0.51.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
graphrag = "graph_rag.main:run"
graphrag-seed-gtd = "gtd.seed_gtd:main"
