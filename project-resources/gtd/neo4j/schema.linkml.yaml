# Derived graph schema; semantic alignments are explicitly proposed.
id: https://example.org/graphrag/gtd/neo4j-schema
name: gtd_neo4j
title: GTD Neo4j graph model
description: Structural LinkML representation of schema-inventory.json, derived from the independent GTD
  Cypher import. Neo4j annotations are local conventions; no GTDOnto alignment is asserted.
prefixes:
  linkml: https://w3id.org/linkml/
  gtd_graph: https://example.org/graphrag/gtd/neo4j-schema/
  gtd: http://www.semanticweb.org/user/ontologies/2020/3/GTDB#
default_prefix: gtd_graph
imports:
- linkml:types
default_range: string
see_also:
- https://gist.github.com/rvanbruggen/0a9f607b1b2647e6ea3b
comments:
- The example.org namespace identifies this local derived schema; it is not a published ontology namespace.
- Unspecified property types use AnyValue rather than guessing a datatype.
- Properties are optional; no identifiers or uniqueness constraints are inferred.
- Relationship slots allow zero or more targets as a permissive modeling choice, not a verified cardinality.
- Relationship values are class-valued objects; database lookup and reference serialization require a
  separate adapter and identifier policy.
- Neo4j annotations preserve labels, property names, relationship types, endpoints and directions; LinkML
  does not execute them.
- Types describe the actual import expressions, not intended GTD semantics. LOAD CSV values remain strings
  unless converted.
- No cardinality or uniqueness constraints are inferred.
- Weapon represents a GTD weapon-type category in this import.
- Ontology mappings have not been established.
annotations:
  derived_from: schema-inventory.json
  mapping_status: proposed alignments embedded in classes/slots
classes:
  AnyValue:
    class_uri: linkml:Any
    description: An unconstrained value for properties whose types are unspecified in the source inventory.
  AttackType:
    description: Node with Neo4j label AttackType.
    annotations:
      neo4j_label: AttackType
      mapping_status: proposed
      mapping_provenance: Local GTDOnto/GTD Cypher comparison for integration testing, 2026-10-12
      mapping_note: Attack is used in the ontology attack-type hierarchy; category alignment requires
        review.
    attributes:
      id:
        description: Neo4j property AttackType.id.
        range: AnyValue
        annotations:
          neo4j_property: id
          type_from_import: unspecified
      name:
        description: Neo4j property AttackType.name.
        range: AnyValue
        annotations:
          neo4j_property: name
          type_from_import: unspecified
    close_mappings:
    - gtd:Attack
  City:
